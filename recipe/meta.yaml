{% set name = "castepinput" %}
{% set version = "0.1.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/castepinput-{{ version }}.tar.gz
  sha256: df7542255fc837e60d5286e6f1cd5df09ecac53cf786ca4aaa1f25296ba13ed7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - numpy
    - python >=3.6
    - six

test:
  imports:
    - castepinput
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/zhubonan/castepinput
  summary: A general reader/writer for CASTEP inputs
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrisjsewell
